# Baut die App bei jedem Push auf „main“, testet sie und veröffentlicht sie auf GitHub Pages:
# https://prynz.github.io/kartenstudio/
name: Live-Vorschau (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  # Rauchtest: klickt die wichtigsten Abläufe im echten Browser durch (ohne Internet-Dienste).
  # Schlägt er fehl, wird nichts veröffentlicht – die Live-Seite bleibt auf dem letzten guten Stand.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Rauchtest
        run: |
          npx vite preview --port 4173 &
          npx wait-on -t 30000 http://localhost:4173/ || sleep 5
          OFFLINE=1 node tests/smoke.mjs http://localhost:4173/ test-results
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-bilder
          path: test-results

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
